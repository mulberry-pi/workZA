<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Application Form</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/style.css">
    </head>

<div class="background">
    <body>
            <div class="navbar">
                <div class="icon">
                    <h2 class="logo">WorkZA</h2>
                </div>

                <div class="menu">
                    <ul>
                        <li><a href="index.html">Home</a></li>
                        <li><a href="listing.html">Job Listings</a></li>
                    </ul>
                </div>
            </div>

        <div class="container">
            <h2>Application Form</h2>

            <form action="submit_application.php" method="POST">
                <fieldset>
                    <legend>Personal Details</legend>

                    <label for="fullName">Full Name:</label>
                    <input type="text" id="fullName" name="fullName" placeholder="Jane Doe" value="">
                    <div class="error-message" id="fullNameError"></div>

                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" placeholder="JaneDoe@email.com" value="">
                    <div class="error-message" id="emailError"></div>

                    <label for="phone">Phone Number:</label>
                    <input type="tel" id="phone" name="phone" placeholder="0123456789" value="">
                    <div class="error-message" id="phoneError"></div>

                    <label for="saId">South African ID Number:</label>
                    <input type="text" id="saId" name="saId" placeholder="1234567890123" value="">
                    <div class="error-message" id="saIdError"></div>

                    <label for="city">City of Residence:</label>
                    <input type="text" id="city" name="city" placeholder="Johannesburg" value="">
                    <div class="error-message" id="cityError"></div>
                </fieldset>

                <fieldset>
                    <legend>Application Details</legend>
                    <label for="jobCategory">Job Category Applying For</label>
                    <select id="jobCategory" name="jobCategory">
                        <option value="" selected disabled hidden>Please select a category</option>
                        <option value="Technology">Technology</option>
                        <option value="Finance">Finance</option>
                        <option value="Healthcare">Healthcare</option>
                        <option value="Engineering">Engineering</option>
                        <option value="Education">Education</option>
                        <option value="Retail">Retail</option>
                    </select>
                    <div class="error-message" id="jobCategoryError"></div>

                    <label for="experience">Years of Experience</label>
                    <input type="number" id="experience" name="experience" min="0" max="50" step="1" value="">
                    <div class="error-message" id="experienceError"></div>

                    <label for="qualification">Highest Qualification</label>
                    <select id="qualification" name="qualification">
                        <option value="" selected disabled hidden>Please select your qualification</option>
                        <option value="Matric">Matric</option>
                        <option value="Certificate">Certificate</option>
                        <option value="Diploma">Diploma</option>
                        <option value="Degree">Degree</option>
                        <option value="Postgraduate">Postgraduate</option>
                    </select>
                    <div class="error-message" id="qualificationError"></div>

                    <label for="coverLetter">Cover Letter/Motivation</label>
                    <textarea id="coverLetter" name="coverLetter" rows="10" cols="40" placeholder="Type your motivation here..."></textarea>
                    <div class="error-message" id="coverLetterError"></div>
                </fieldset>

                <fieldset>
                    <legend>Availability</legend>
                    <label for="startDate">Available Start Date</label>
                    <input type="date" id="startDate" name="startDate" value="">
                    <div class="error-message" id="startDateError"></div>

                    <label>Preferred Work Type</label>
                    <div class="radio-group">
                        <input type="radio" id="fullTime" name="workType" value="Full-time">
                        <label for="fullTime">Full-time</label>
                    </div>
                    <div class="radio-group">
                        <input type="radio" id="partTime" name="workType" value="Part-time">
                        <label for="partTime">Part-time</label>
                    </div>
                    <div class="radio-group">
                        <input type="radio" id="remote" name="workType" value="Remote">
                        <label for="remote">Remote</label>
                    </div>
                    <div class="radio-group">
                        <input type="radio" id="hybrid" name="workType" value="Hybrid">
                        <label for="hybrid">Hybrid</label>
                    </div>
                    <div class="radio-group">
                        <input type="radio" id="contract" name="workType" value="Contract">
                        <label for="contract">Contract</label>
                    </div>
                    <div class="error-message" id="workTypeError"></div>
                </fieldset>

                <fieldset>
                    <legend>Agreement</legend>
                    <label for="agreement">I confirm that all information provided is accurate and true.</label>
                    <input type="checkbox" id="agreement" name="agreement">
                    <div class="error-message" id="agreementError"></div>
                </fieldset>

                <button type="submit">Submit Application</button>
            </form>
        </div>

        <div class="modal-overlay" id="successModal" aria-hidden="true">
            <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
                <h3 id="modalTitle">Application Submitted!</h3>
                <p id="modalMessage"></p>
                <button type="button" id="closeModal">Close</button>
            </div>
        </div>

        <script src="javascript/functions.js"></script>
    </body>

    <footer>
        <p> &copy; 2026 WorkZA - Aisha Mshumpela and Matsobane Madisha. All rights reserved.</p>
    </footer>
</div>
</html>
